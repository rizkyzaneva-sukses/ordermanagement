<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidak ada koneksi — OrderPro</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box; text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb; color: #111827;
    }
    p { color: #6b7280; margin: 0 0 20px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #2563eb;
      border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      p { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tidak ada koneksi internet</h1>
    <p>OrderPro butuh internet supaya pesanan dan stok selalu terbaru.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
